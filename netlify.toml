[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  VITE_API_URL = "https://stingray-app-b5k9t.ondigitalocean.app/api"
  VITE_GA_MEASUREMENT_ID = "G-5MJZQXB3Z3"

# SPA redirect - all routes should serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

