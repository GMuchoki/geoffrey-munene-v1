<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Default Meta Tags (will be overridden by react-helmet-async on each page) -->
    <title>Geoffrey Munene - Remote Work Coach & Content Creator</title>
    <meta name="description" content="Learn how to land your dream remote job. Get free tools, resources, and guidance to build a successful remote career. AI-powered resume builder, job listings, and video tutorials." />
    <meta name="keywords" content="remote work, remote jobs, work from home, digital nomad, remote career, online jobs, remote work tips, remote work coaching" />
    <meta name="author" content="Geoffrey Munene" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    
    <!-- Open Graph Defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Geoffrey Munene" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@munenegeoffrey" />
    <meta name="twitter:site" content="@munenegeoffrey" />
    
    <!-- Theme -->
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
